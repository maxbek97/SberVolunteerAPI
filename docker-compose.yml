version: '3.9'

services:
    mysql:
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 10
        image: mysql:8.0
        container_name: sber-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        ports:
          - "3307:3306"
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
          - mysql_data:/var/lib/mysql

    api:
        build: .
        container_name: sber-volunteer-api
        depends_on:
            mysql:
                condition: service_healthy
        environment:
          DB_HOST: ${DB_HOST}
          DB_PORT: ${DB_PORT}
          DB_DATABASE: ${DB_DATABASE}
          DB_USER: ${DB_USER}
          DB_PASSWORD: ${DB_PASSWORD}
        ports:
          - "8080:8080"
        command: ["dotnet", "SberVolunteerAPI.dll"]
volumes:
  mysql_data:
